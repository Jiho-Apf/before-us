<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>비포어스 비밀번호 다시 설정</title></head>
<body style="margin:0;padding:0;background:#F9F8FD;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;color:#24204A;word-break:keep-all;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F9F8FD;">
    <tr><td align="center" style="padding:48px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">
        <tr><td style="padding:0 8px 28px;">
          <span style="display:inline-block;width:12px;height:12px;border-radius:6px;background:#614CC4;"></span>
          <span style="display:inline-block;width:12px;height:12px;border-radius:6px;background:#3A54CA;margin-left:4px;"></span>
          <span style="font-size:20px;font-weight:700;margin-left:10px;vertical-align:middle;">비포어스</span>
          <span style="font-size:11px;letter-spacing:3px;color:#7A76A0;margin-left:8px;vertical-align:middle;">BEFORE US</span>
        </td></tr>
        <tr><td style="background:#FFFFFF;border:1px solid #EEEAFA;border-radius:20px;padding:40px 32px;">
          <p style="margin:0 0 14px;font-size:12px;font-weight:700;letter-spacing:2px;color:#3A54CA;">PASSWORD · 비밀번호</p>
          <h1 style="margin:0 0 18px;font-size:26px;line-height:1.45;font-weight:700;">새 비밀번호를<br>정해 주세요.</h1>
          <p style="margin:0 0 26px;font-size:15px;line-height:1.85;color:#4A4670;">아래 버튼을 누르면 새 비밀번호를 정하는 화면이 열려요. 비밀번호를 바꾸면 다른 기기의 로그인도 함께 끝나요.</p>
          <table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="border-radius:12px;background:#614CC4;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:15px 28px;font-size:15px;font-weight:700;color:#FFFFFF;text-decoration:none;">새 비밀번호 정하기 →</a>
          </td></tr></table>
        </td></tr>
        <tr><td style="padding:24px 8px 0;font-size:12px;line-height:1.8;color:#7A76A0;">
          <p style="margin:0 0 6px;">링크는 1시간 동안, 한 번만 쓸 수 있어요.</p>
          <p style="margin:0 0 14px;">비밀번호 재설정을 요청하지 않았다면 이 메일은 무시해 주세요. 비밀번호는 바뀌지 않아요.</p>
          <p style="margin:0;color:#A19DC0;">BEFORE US · 끌리는 사람을, 천천히 알아갑니다.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
