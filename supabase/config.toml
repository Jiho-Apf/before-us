# 비포어스 Supabase 설정(로그인·메일·2단계 인증). `npx supabase config push` 로 실제 프로젝트에 반영한다.
project_id = "mmrqcefipllmcqztksqm"

[auth]
site_url = "https://before-us-3jr4.vercel.app"
additional_redirect_urls = ["https://before-us-3jr4.vercel.app/**", "http://localhost:8443/**", "http://localhost:8444/**", "https://before-us-3jr4-git-beta-ji-ho-jung-s-projects.vercel.app/**"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
otp_expiry = 3600

# 비포어스 메일(라벤더 안개 톤). {{ .ConfirmationURL }}은 Supabase가 채운다.
[auth.email.template.confirmation]
subject = "[비포어스] 가입을 마치고 소개 신청을 시작해 주세요"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "[비포어스] 새 비밀번호를 정해 주세요"
content_path = "./supabase/templates/recovery.html"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.storage-cleanup]
verify_jwt = false

[functions.send-notifications]
verify_jwt = false

[functions.partner-photo]
verify_jwt = false

# 결제 승인·테스트 결제 취소: 함수 안에서 회원·운영진 로그인 토큰으로 서버 함수를 불러 확인한다.
[functions.payments-confirm]
verify_jwt = false

[functions.payments-cancel]
verify_jwt = false

